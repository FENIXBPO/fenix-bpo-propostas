<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FÊNIX Intelligent BPO — Levantamento de Dados</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block;background:#050505}
</style>
</head>
<body>
<iframe id="app" src="/homologacao/coleta-fenix-wizard.html" title="Levantamento de Dados FÊNIX"></iframe>
<script>
const LOGO='https://raw.githubusercontent.com/FENIXBPO/fenix-bpo-propostas/feat/proposta-v2-rev10-homologacao/assets/fenix-logo-header-crop.webp';
const SYMBOL='https://raw.githubusercontent.com/FENIXBPO/fenix-bpo-propostas/feat/proposta-v2-rev10-homologacao/assets/fenix-symbol.png';
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    const logo=d.querySelector('.logo');
    if(logo){logo.src=LOGO;logo.removeAttribute('srcset');}
    d.querySelectorAll('.freeNavNote').forEach(el=>el.remove());
    const style=d.createElement('style');
    style.textContent=`
      .card:after{background-image:url('${SYMBOL}')!important}
      .progressWrap,.main>div:nth-of-type(2){margin-bottom:0!important}
      .topbar{position:relative!important;justify-content:center!important;padding-left:320px!important;padding-right:320px!important}
      .topCopy{text-align:center!important;justify-items:center!important}
      .topTitle,.topFlow{text-align:center!important}
      .logo{position:absolute!important;right:34px!important;top:50%!important;transform:translateY(-50%)!important}
      @media(max-width:820px){
        .topbar{padding-left:120px!important;padding-right:120px!important}
        .logo{right:14px!important}
        .topCopy{max-width:100%!important}
      }
      @media(max-width:560px){
        .topbar{padding-left:10px!important;padding-right:90px!important;justify-content:center!important}
        .topTitle{font-size:12px!important}
        .topFlow{font-size:9px!important;white-space:normal!important}
        .logo{right:8px!important;max-width:78px!important;height:40px!important}
      }
    `;
    d.head.appendChild(style);
  }catch(e){console.error('Falha ao aplicar correção visual FÊNIX',e)}
});
</script>
</body>
</html>
