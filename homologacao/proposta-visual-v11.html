<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>FÊNIX — Homologação visual v11</title>
  <link rel="stylesheet" href="/master-template/proposta-master-limpa-v1.css?v=11" />
  <link rel="stylesheet" href="/assets/proposta-refino-mkt-v11.css?v=11" />
</head>
<body>
  <div class="homolog-version">HOMOLOGAÇÃO V11</div>
  <div id="masterMount"></div>
  <script>
    (async()=>{
      const r=await fetch('/master-template/proposta-master-limpa-v1.html?v=11',{cache:'no-store'});
      if(!r.ok) throw new Error('Falha ao carregar Master');
      const source=await r.text();
      const doc=new DOMParser().parseFromString(source,'text/html');
      const deck=doc.querySelector('.deck');
      if(!deck) throw new Error('Master sem deck');
      document.getElementById('masterMount').innerHTML=deck.outerHTML;
      const s=document.createElement('script');
      s.src='/master-template/proposta-master-limpa-v1.js?demo=1&v=11';
      document.body.appendChild(s);
    })().catch(err=>{document.body.innerHTML='<pre style="color:white;background:black;padding:30px">'+err.message+'</pre>'});
  </script>
</body>
</html>
