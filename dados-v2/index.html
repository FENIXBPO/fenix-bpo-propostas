<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FÊNIX Intelligent BPO — Levantamento de Dados</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block;background:#050505}
</style>
</head>
<body>
<iframe id="app" src="/homologacao/coleta-fenix-wizard.html" title="Levantamento de Dados FÊNIX"></iframe>
<script>
const LOGO='/assets/fenix-logo-header-crop.webp';
const SYMBOL='/assets/fenix-symbol.png';
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    const w=frame.contentWindow;
    const logo=d.querySelector('.logo');
    if(logo){logo.src=LOGO;logo.removeAttribute('srcset');}
    d.querySelectorAll('.freeNavNote').forEach(el=>el.remove());

    const atividade=d.getElementById('atividade_cnpj');
    if(atividade){
      atividade.removeAttribute('readonly');
      atividade.placeholder='Preenchida pelo CNPJ; corrija se necessário';
    }

    const filiais=d.getElementById('filiais');
    if(filiais){
      filiais.closest('.field')?.remove();
    }

    const originalCollect=w.collect;
    if(typeof originalCollect==='function'){
      w.collect=function(){
        const data=originalCollect();
        delete data.filiais;
        return data;
      };
    }

    w.completion=function(){
      const val=id=>d.getElementById(id)?.value?.trim?.()||'';
      const ids=['cnpj','razao','faturamento','endereco','bairro','cep','cidade_uf','funcionarios','cnpjs','implantacao_situacao','dor_atrasados','financeiro_interno','descricao','sistema_atual','conta_azul_usa','contabilidade_definida','frequencia','recebimentos','pagamentos','notas','notas_recebidas','lancamentos','comissoes_lancadas','bancos','cartoes','contas_aplicacao','centros_custo','dor','expectativa','consome_tempo','responsavel','cargo','email','telefone'];
      let done=ids.filter(id=>val(id)!=='').length,total=ids.length+4;
      if(d.querySelectorAll('input[name=segmento]:checked').length)done++;
      if(d.querySelectorAll('input[name=escopo]:checked').length)done++;
      if(d.querySelectorAll('input[name=objetivo]:checked').length)done++;
      if(val('repasses')||val('conta_azul_valor'))done++;
      return Math.round(done/total*100);
    };

    const contaAzulUso=d.getElementById('conta_azul_usa');
    const contaAzulValor=d.getElementById('conta_azul_valor');
    const contaAzulPagador=d.getElementById('conta_azul_pagador');
    const contaAzulFields=[contaAzulValor?.closest('.field'),contaAzulPagador?.closest('.field')].filter(Boolean);
    const syncContaAzul=()=>{
      const uso=contaAzulUso?.value||'';
      const show=uso==='sim'||uso==='pretende';
      contaAzulFields.forEach(el=>el.style.display=show?'':'none');
      if(uso==='nao'){
        if(contaAzulValor)contaAzulValor.value='';
        if(contaAzulPagador)contaAzulPagador.value='';
      }
      if(typeof w.updateProgress==='function')w.updateProgress();
    };
    contaAzulUso?.addEventListener('change',syncContaAzul);
    syncContaAzul();

    const originalValidate=w.validateFinal;
    if(typeof originalValidate==='function'){
      w.validateFinal=function(data){
        const existing=originalValidate(data);
        if(existing)return existing;
        const email=String(data.email||'').trim();
        if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return{s:7,msg:'Informe um e-mail válido.'};
        return null;
      };
    }

    w.buildReview=function(){
      const data=typeof w.collect==='function'?w.collect():{};
      const contaAzulMap={sim:'Usa atualmente',pretende:'Pretende utilizar',nao:'Não utiliza'};
      const contaAzul=[contaAzulMap[data.conta_azul_usa]||'Não informado',data.conta_azul_valor||'',data.conta_azul_pagador?`pagamento: ${data.conta_azul_pagador.replaceAll('_',' ')}`:''].filter(Boolean).join(' · ');
      const volumetria=[
        data.recebimentos&&`Receb. ${data.recebimentos}`,
        data.pagamentos&&`Pag. ${data.pagamentos}`,
        data.notas&&`NFS-e ${data.notas}`,
        data.notas_recebidas&&`Notas rec. ${data.notas_recebidas}`
      ].filter(Boolean).join(' · ');
      const rows=[
        ['Empresa',data.razao||'Não informado'],
        ['Segmentos',data.ramos||'Não informado'],
        ['CNPJ',data.cnpj||'Não informado'],
        ['Faturamento',data.faturamento||'Não informado'],
        ['Operação',data.descricao||'Não informado'],
        ['ERP / sistema',data.sistema_atual||'Não informado'],
        ['Volumetria',volumetria||'Não informada'],
        ['Escopo',data.escopo?.length?data.escopo.join(', '):'Nenhum item'],
        ['Conta Azul',contaAzul],
        ['Outros repasses',data.repasses==='Sim'?(data.repasses_detalhes||'Sim, sem detalhes'):(data.repasses||'Não informado')],
        ['Objetivos',data.objetivos?.length?data.objetivos.join(', '):'Não informado'],
        ['Contato',[data.responsavel,data.email].filter(Boolean).join(' · ')||'Não informado']
      ];
      const review=d.getElementById('review');
      if(review)review.innerHTML=rows.map(([a,b])=>`<div class="reviewRow"><strong>${a}</strong><span>${b}</span></div>`).join('');
    };

    const style=d.createElement('style');
    style.textContent=`
      .card:after{background-image:url('${SYMBOL}')!important}
      .progressWrap,.main>div:nth-of-type(2){margin-bottom:0!important}
      .topbar{position:relative!important;justify-content:center!important;padding-left:320px!important;padding-right:320px!important}
      .topCopy{text-align:center!important;justify-items:center!important}
      .topTitle,.topFlow{text-align:center!important}
      .logo{position:absolute!important;right:34px!important;top:50%!important;transform:translateY(-50%)!important}
      .reviewRow span{text-align:right;overflow-wrap:anywhere}
      .progressHead{font-size:14px!important}
      .dot{font-size:13px!important;font-weight:700!important;padding-top:10px!important;line-height:1.2!important;color:#a9a197!important}
      .dot.active{font-weight:950!important;color:var(--gold2)!important}
      .multi summary{font-size:16px!important;padding:13px 15px!important}
      .multiMenu label{font-size:15px!important;line-height:1.3!important;padding:10px 12px!important;align-items:center!important}
      .multiMenu input{width:18px!important;height:18px!important;flex:0 0 18px!important;margin:0!important}
      @media(max-width:820px){
        .topbar{padding-left:120px!important;padding-right:120px!important}
        .logo{right:14px!important}
        .topCopy{max-width:100%!important}
        .dot{font-size:12px!important;min-width:96px!important}
        .progressHead{font-size:13px!important}
      }
      @media(max-width:560px){
        .topbar{padding-left:10px!important;padding-right:90px!important;justify-content:center!important}
        .topTitle{font-size:12px!important}
        .topFlow{font-size:9px!important;white-space:normal!important}
        .logo{right:8px!important;max-width:78px!important;height:40px!important}
        .multi summary{font-size:16px!important}
        .multiMenu label{font-size:15px!important}
      }
    `;
    d.head.appendChild(style);
    if(typeof w.updateProgress==='function')w.updateProgress();
  }catch(e){console.error('Falha ao aplicar correção funcional FÊNIX',e)}
});
</script>
</body>
</html>
