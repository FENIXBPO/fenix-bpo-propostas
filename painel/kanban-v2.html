<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FÊNIX BPO — Pipeline Comercial</title>
<style>
:root{color-scheme:dark;--bg:#070707;--panel:#0d0e10;--line:#2b2f36;--gold:#efbd49;--text:#f3f5f7;--muted:#8f97a3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 28% 0,rgba(184,126,24,.14),transparent 30%),#070707;color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:auto}.shell{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;border-right:1px solid #4d3715;background:linear-gradient(180deg,#0c0b09 0,#080808 65%,#100b04 100%);padding:18px 10px;display:flex;flex-direction:column}.brand{height:62px;background:url('/assets/fenix-logo-header-crop.webp') center/contain no-repeat;margin-bottom:14px}.nav{display:grid;gap:6px}.nav button,.nav a{width:100%;border:0;background:transparent;color:#d7d9dd;text-decoration:none;padding:10px 11px;border-radius:8px;text-align:left;font-size:12px;cursor:pointer}.nav .active{background:linear-gradient(90deg,rgba(196,137,27,.28),rgba(196,137,27,.07));color:#ffd76e;border-left:3px solid var(--gold)}.motto{margin-top:auto;color:#cfa74e;font-size:10px;line-height:1.7;letter-spacing:.18em;text-transform:uppercase;padding:14px 10px;border-top:1px solid #493515}
.main{padding:18px 16px 12px;min-width:0}.topbar{display:grid;grid-template-columns:1fr minmax(280px,360px) auto;align-items:center;gap:14px;margin-bottom:14px}.title h1{margin:0;color:#f1c15b;font-size:25px;letter-spacing:.03em}.title p{margin:4px 0 0;color:#a4a7ad;font-size:13px}.search{display:flex;align-items:center;gap:8px;background:#111214;border:1px solid #2a2c31;border-radius:22px;padding:0 14px;height:40px}.search input{background:transparent;border:0;outline:0;color:white;width:100%;font:inherit;font-size:13px}.action{border:1px solid #926716;background:linear-gradient(180deg,#14110b,#0d0c0a);color:#f6e4b2;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:12px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:linear-gradient(90deg,rgba(139,94,17,.15),rgba(0,0,0,0));padding:10px;border-radius:12px;margin-bottom:10px}.kpi{border:1px solid #34312b;background:linear-gradient(145deg,#101214,#0b0c0e);border-radius:10px;padding:11px 12px;min-height:76px;display:flex;align-items:center;gap:10px}.kpi .ico{width:40px;height:40px;border:1px solid #3b4048;border-radius:9px;display:grid;place-items:center;font-size:18px;flex:0 0 auto}.kpi strong{display:block;font-size:22px;line-height:1.05}.kpi span{color:#b4b7bd;font-size:11px}.filters{display:grid;grid-template-columns:1.25fr .85fr .85fr .85fr;gap:8px;margin:8px 0 12px}.filters input,.filters select{height:38px;border:1px solid #343a43;background:#0f1217;color:#eaecef;border-radius:8px;padding:0 11px;font:inherit;font-size:12px;outline:0}.board-wrap{overflow-x:auto;padding-bottom:8px}.board{display:grid;grid-template-columns:repeat(6,minmax(224px,1fr));gap:8px;min-width:1375px}.col{border:1px solid #2f343b;background:linear-gradient(180deg,#0d1013,#090b0d);border-radius:9px;min-height:565px;overflow:hidden}.col-head{padding:10px 11px;border-top:4px solid var(--stage);background:linear-gradient(180deg,color-mix(in srgb,var(--stage) 22%,#101214),#101214)}.col-head-top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:12px;letter-spacing:.02em}.col-count{font-size:18px;color:var(--stage)}.col-total{font-size:10px;color:#bac0c7;margin-top:3px}.cards{padding:7px;display:grid;gap:7px;align-content:start}.empty{color:#737b86;font-size:11px;border:1px dashed #28303a;border-radius:7px;padding:18px 10px;text-align:center}.deal{border:1px solid #323841;background:linear-gradient(145deg,#181b1f,#111418);border-radius:8px;padding:9px;cursor:pointer;transition:.15s ease;box-shadow:0 7px 16px rgba(0,0,0,.17)}.deal:hover{transform:translateY(-1px);border-color:#6e5523;box-shadow:0 10px 24px rgba(0,0,0,.25)}.deal h3{font-size:12px;line-height:1.25;margin:0 0 4px;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}.cnpj{font-size:9px;color:#9299a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{display:inline-block;margin-top:6px;padding:3px 6px;border-radius:5px;background:#263345;color:#a9d0ff;font-size:9px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.deal-meta{display:flex;justify-content:space-between;gap:7px;margin-top:7px;font-size:9px;color:#c1c5cb}.money{margin-top:7px;font-size:11px;color:#f2c863;font-weight:800}.footer{margin-top:8px;border:1px solid #5d431a;background:linear-gradient(90deg,#0e0c09,#08090a);border-radius:9px;padding:10px 14px;color:#d6aa4b;text-align:center;letter-spacing:.14em;font-size:9px}.loading,.error{padding:36px;text-align:center;color:#bbb}.error{color:#f0b66e}.hidden{display:none!important}
@media(max-width:1050px){.shell{grid-template-columns:156px minmax(0,1fr)}.side{padding:14px 8px}.topbar{grid-template-columns:1fr}.search{width:100%}.kpis{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.board{grid-template-columns:repeat(6,235px);min-width:max-content}}
@media(max-width:760px){.shell{display:block}.side{display:none}.main{padding:14px 10px}.kpis,.filters{grid-template-columns:1fr 1fr}.board{grid-template-columns:repeat(6,230px)}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="brand" aria-label="FÊNIX Intelligent BPO"></div>
  <nav class="nav">
    <button class="active">▦ &nbsp; Pipeline Comercial</button>
    <a href="/dados-v2/">＋ &nbsp; Nova Coleta</a>
    <button>♧ &nbsp; Clientes</button><button>▤ &nbsp; Propostas</button><button>✎ &nbsp; Contratos</button><button>✓ &nbsp; Tarefas</button><button>▣ &nbsp; Agenda</button><button>▥ &nbsp; Relatórios</button>
  </nav>
  <div class="motto">“Organização gera liberdade”</div>
</aside>
<main class="main">
  <div class="topbar">
    <div class="title"><h1>PIPELINE COMERCIAL</h1><p>Mais que números, relações de valor.</p></div>
    <div class="search"><span>⌕</span><input id="globalSearch" placeholder="Buscar cliente, CNPJ ou responsável..."></div>
    <button class="action" onclick="location.href='/dados-v2/'">＋ &nbsp; Nova Coleta</button>
  </div>
  <section class="kpis">
    <div class="kpi"><div class="ico">♧</div><div><strong id="kpiActive">—</strong><span>Oportunidades ativas</span></div></div>
    <div class="kpi"><div class="ico">$</div><div><strong id="kpiPotential">—</strong><span>Receita potencial</span></div></div>
    <div class="kpi"><div class="ico">▤</div><div><strong id="kpiProposals">—</strong><span>Propostas enviadas</span></div></div>
    <div class="kpi"><div class="ico">🤝</div><div><strong id="kpiContracts">—</strong><span>Contratos</span></div></div>
  </section>
  <section class="filters">
    <input id="filterClient" placeholder="Buscar cliente">
    <select id="filterStage"><option value="">Todas as etapas</option><option value="lead">Lead</option><option value="dados">Dados recebidos</option><option value="analise">Análise CFO</option><option value="proposta">Proposta enviada</option><option value="aceite">Aceite</option><option value="contrato">Contrato</option></select>
    <select id="filterOwner"><option value="">Todos os responsáveis</option></select>
    <select id="filterSegment"><option value="">Todos os segmentos</option></select>
  </section>
  <div id="loading" class="loading">Carregando oportunidades…</div>
  <div id="error" class="error hidden"></div>
  <div class="board-wrap"><section id="board" class="board hidden"></section></div>
  <div class="footer">✦ &nbsp; PROCESSOS HOJE. LIBERDADE SEMPRE. &nbsp; · &nbsp; FÊNIX BPO</div>
</main>
</div>
<script>
const STAGES=[
  {id:'lead',label:'1. LEAD',color:'#bfc4cb'},
  {id:'dados',label:'2. DADOS RECEBIDOS',color:'#4b8dff'},
  {id:'analise',label:'3. ANÁLISE CFO',color:'#e3ad3f'},
  {id:'proposta',label:'4. PROPOSTA ENVIADA',color:'#f08a63'},
  {id:'aceite',label:'5. ACEITE',color:'#51d996'},
  {id:'contrato',label:'6. CONTRATO',color:'#58c6e6'}
];
const STAGE_RANK={lead:0,dados:1,analise:2,proposta:3,aceite:4,contrato:5};
let all=[];
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function num(v){const n=Number(String(v??'').replace(/\./g,'').replace(',','.'));return Number.isFinite(n)?n:0}
function monthly(i){const t=i?.proposal?.commercial_terms||{};return num(t.final_monthly??t.base_monthly??t.monthly_fee??t.mensalidade??t.valor_mensal??t.monthly??0)}
function stage(i){const s=String(i.status||'').toLowerCase();if(s==='encerrado')return null;if(['contrato_autorizado','autorizado_cfo_aguardando_geracao','contrato_gerado','gerado','aguardando_assinatura','assinado','implantacao','em_implantacao','operacao_iniciada'].includes(s))return'contrato';if(['proposta_aceita_aguardando_cfo','aceite_validado_cfo','aceita','aceite'].includes(s))return'aceite';if(['proposta_publicada','publicada','enviada_cliente','proposta_enviada'].includes(s))return'proposta';if(['proposta_aprovada_cfo','aprovada_cfo','em_analise_cfo','rascunho_cfo'].includes(s))return'analise';if(['recebido','dados_recebidos','novo'].includes(s))return'dados';return'lead'}
function clientName(i){return i.client?.nome_fantasia||i.client?.razao_social||i.raw_payload?.razao_social||'Cliente sem nome'}
function cnpj(i){return String(i.client?.cnpj||i.raw_payload?.cnpj||'').replace(/\D/g,'')}
function owner(i){return i.raw_payload?._pipeline?.owner||i.raw_payload?.responsavel_interno||'FÊNIX'}
function segment(i){return i.ramo||i.raw_payload?.ramo||'Sem segmento'}
function stamp(i){const d=new Date(i.updated_at||i.created_at||Date.now());return d.toLocaleDateString('pt-BR')}
function ts(i){return new Date(i.updated_at||i.created_at||0).getTime()||0}
function dedupe(items){const map=new Map();for(const i of items){const key=cnpj(i)||i.client_id||clientName(i).trim().toLowerCase();const cur=map.get(key);if(!cur){map.set(key,i);continue}const a=STAGE_RANK[stage(i)]??-1,b=STAGE_RANK[stage(cur)]??-1;if(a>b||(a===b&&ts(i)>ts(cur)))map.set(key,i)}return[...map.values()]}
function render(){
  const q=(document.getElementById('filterClient').value||document.getElementById('globalSearch').value||'').trim().toLowerCase();
  const fs=document.getElementById('filterStage').value,fo=document.getElementById('filterOwner').value,fg=document.getElementById('filterSegment').value;
  const filtered=all.filter(i=>{const st=stage(i);if(!st)return false;const hay=[clientName(i),cnpj(i),owner(i),segment(i)].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!fs||st===fs)&&(!fo||owner(i)===fo)&&(!fg||segment(i)===fg)});
  const board=document.getElementById('board');board.innerHTML='';
  STAGES.forEach(s=>{const items=filtered.filter(i=>stage(i)===s.id);const total=items.reduce((a,i)=>a+monthly(i),0);const col=document.createElement('article');col.className='col';col.style.setProperty('--stage',s.color);col.innerHTML=`<header class="col-head"><div class="col-head-top"><span>${s.label}</span><b class="col-count">${items.length}</b></div><div class="col-total">${money(total)}</div></header><div class="cards">${items.length?'':`<div class="empty">Nenhum cliente nesta etapa.</div>`}</div>`;const cards=col.querySelector('.cards');items.forEach(i=>{const name=clientName(i);const d=document.createElement('div');d.className='deal';d.title=name;d.innerHTML=`<h3>${esc(name)}</h3><div class="cnpj">CNPJ ${esc(i.client?.cnpj||'—')}</div><span class="tag">${esc(segment(i))}</span>${monthly(i)?`<div class="money">${money(monthly(i))}/mês</div>`:''}<div class="deal-meta"><span>${esc(owner(i))}</span><span>${stamp(i)}</span></div>`;d.onclick=()=>location.href=`/painel/analise/?id=${encodeURIComponent(i.id)}`;cards.appendChild(d)});board.appendChild(col)});
  updateKpis();
}
function updateKpis(){const active=all.filter(i=>stage(i));const potential=active.reduce((a,i)=>a+monthly(i),0);const proposals=active.filter(i=>['proposta','aceite','contrato'].includes(stage(i))).length;const contracts=active.filter(i=>stage(i)==='contrato').length;document.getElementById('kpiActive').textContent=active.length;document.getElementById('kpiPotential').textContent=money(potential);document.getElementById('kpiProposals').textContent=proposals;document.getElementById('kpiContracts').textContent=contracts}
function populateFilters(){const owners=[...new Set(all.map(owner).filter(Boolean))].sort(),segments=[...new Set(all.map(segment).filter(Boolean))].sort();const o=document.getElementById('filterOwner'),s=document.getElementById('filterSegment');owners.forEach(v=>o.insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`));segments.forEach(v=>s.insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`))}
async function load(){try{const r=await fetch('/api/internal-intakes',{credentials:'same-origin'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`Erro ${r.status}`);all=dedupe(Array.isArray(j.items)?j.items:[]);populateFilters();document.getElementById('loading').classList.add('hidden');document.getElementById('board').classList.remove('hidden');render()}catch(e){document.getElementById('loading').classList.add('hidden');const box=document.getElementById('error');box.textContent='Não foi possível carregar o pipeline: '+e.message;box.classList.remove('hidden')}}
['filterClient','globalSearch'].forEach(id=>document.getElementById(id).addEventListener('input',render));['filterStage','filterOwner','filterSegment'].forEach(id=>document.getElementById(id).addEventListener('change',render));load();
</script>
</body>
</html>
