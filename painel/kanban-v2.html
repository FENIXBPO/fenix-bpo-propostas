<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FÊNIX BPO — Pipeline Comercial</title>
<style>
:root{color-scheme:dark;--bg:#070707;--panel:#0d0e10;--panel2:#111419;--line:#2b2f36;--gold:#efbd49;--gold2:#9f6b17;--text:#f3f5f7;--muted:#8f97a3;--green:#5ee0a0;--blue:#4aa3ff;--amber:#f0b94c;--orange:#ff8f61;--cyan:#5bc8e8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 28% 0,rgba(184,126,24,.14),transparent 30%),#070707;color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:auto}.shell{display:grid;grid-template-columns:218px minmax(1200px,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;border-right:1px solid #4d3715;background:linear-gradient(180deg,#0c0b09 0,#080808 65%,#100b04 100%);padding:24px 14px;display:flex;flex-direction:column}.brand{height:74px;background:url('/assets/fenix-logo-header-crop.webp') center/contain no-repeat;margin-bottom:20px}.nav{display:grid;gap:8px}.nav button,.nav a{width:100%;border:0;background:transparent;color:#d7d9dd;text-decoration:none;padding:12px 14px;border-radius:9px;text-align:left;font-size:14px;cursor:pointer}.nav .active{background:linear-gradient(90deg,rgba(196,137,27,.28),rgba(196,137,27,.07));color:#ffd76e;border-left:3px solid var(--gold)}.motto{margin-top:auto;color:#cfa74e;font-size:12px;line-height:1.8;letter-spacing:.22em;text-transform:uppercase;padding:18px 14px;border-top:1px solid #493515}
.main{padding:28px 24px 16px;min-width:0}.topbar{display:flex;align-items:flex-start;gap:22px;justify-content:space-between;margin-bottom:24px}.title h1{margin:0;color:#f1c15b;font-size:31px;letter-spacing:.03em}.title p{margin:6px 0 0;color:#a4a7ad;font-size:16px}.search{display:flex;align-items:center;gap:10px;background:#111214;border:1px solid #2a2c31;border-radius:24px;padding:0 16px;width:min(390px,34vw);height:44px}.search input{background:transparent;border:0;outline:0;color:white;width:100%;font:inherit}.action{border:1px solid #926716;background:linear-gradient(180deg,#14110b,#0d0c0a);color:#f6e4b2;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.kpis{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;background:linear-gradient(90deg,rgba(139,94,17,.18),rgba(0,0,0,0));padding:14px;border-radius:14px;margin-bottom:15px}.kpi{border:1px solid #34312b;background:linear-gradient(145deg,#101214,#0b0c0e);border-radius:11px;padding:16px;min-height:104px;display:flex;align-items:center;gap:14px}.kpi .ico{width:52px;height:52px;border:1px solid #3b4048;border-radius:11px;display:grid;place-items:center;font-size:24px}.kpi strong{display:block;font-size:27px}.kpi span{color:#b4b7bd;font-size:13px}.filters{display:grid;grid-template-columns:1.1fr .75fr .75fr .75fr;gap:12px;margin:12px 0 18px}.filters input,.filters select{height:43px;border:1px solid #343a43;background:#0f1217;color:#eaecef;border-radius:9px;padding:0 13px;font:inherit;outline:0}.board-wrap{overflow-x:auto;padding-bottom:12px}.board{display:grid;grid-template-columns:repeat(6,265px);gap:10px;min-width:max-content}.col{border:1px solid #2f343b;background:linear-gradient(180deg,#0d1013,#090b0d);border-radius:10px;min-height:610px;overflow:hidden}.col-head{padding:12px 13px;border-top:4px solid var(--stage);background:linear-gradient(180deg,color-mix(in srgb,var(--stage) 22%,#101214),#101214)}.col-head-top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;letter-spacing:.03em}.col-count{font-size:20px;color:var(--stage)}.col-total{font-size:11px;color:#bac0c7;margin-top:4px}.cards{padding:8px;display:grid;gap:8px;align-content:start}.empty{color:#737b86;font-size:12px;border:1px dashed #28303a;border-radius:8px;padding:20px 12px;text-align:center}.deal{border:1px solid #323841;background:linear-gradient(145deg,#181b1f,#111418);border-radius:8px;padding:10px;cursor:pointer;transition:.15s ease;box-shadow:0 8px 18px rgba(0,0,0,.18)}.deal:hover{transform:translateY(-1px);border-color:#6e5523;box-shadow:0 10px 26px rgba(0,0,0,.28)}.deal h3{font-size:13px;margin:0 0 4px;color:#fff}.cnpj{font-size:10px;color:#9299a3}.tag{display:inline-block;margin-top:7px;padding:3px 7px;border-radius:6px;background:#263345;color:#a9d0ff;font-size:10px;font-weight:700}.deal-meta{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-size:10px;color:#c1c5cb}.money{margin-top:8px;font-size:12px;color:#f2c863;font-weight:800}.footer{margin-top:10px;border:1px solid #5d431a;background:linear-gradient(90deg,#0e0c09,#08090a);border-radius:10px;padding:14px 20px;color:#d6aa4b;text-align:center;letter-spacing:.18em;font-size:11px}.loading,.error{padding:40px;text-align:center;color:#bbb}.error{color:#f0b66e}.hidden{display:none!important}
@media(max-width:900px){.shell{display:block}.side{display:none}.main{padding:18px 12px}.topbar{display:grid}.search{width:100%}.kpis{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.board{grid-template-columns:repeat(6,250px)}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="brand" aria-label="FÊNIX Intelligent BPO"></div>
  <nav class="nav">
    <button class="active">▦ &nbsp; Pipeline Comercial</button>
    <a href="/dados-v2/">＋ &nbsp; Nova Coleta</a>
    <button>♧ &nbsp; Clientes</button><button>▤ &nbsp; Propostas</button><button>✎ &nbsp; Contratos</button><button>✓ &nbsp; Tarefas</button><button>▣ &nbsp; Agenda</button><button>▥ &nbsp; Relatórios</button>
  </nav>
  <div class="motto">“Organização gera liberdade”</div>
</aside>
<main class="main">
  <div class="topbar">
    <div class="title"><h1>PIPELINE COMERCIAL</h1><p>Mais que números, relações de valor.</p></div>
    <div class="search"><span>⌕</span><input id="globalSearch" placeholder="Buscar cliente, CNPJ ou responsável..."></div>
    <button class="action" onclick="location.href='/dados-v2/'">＋ &nbsp; Nova Coleta</button>
  </div>
  <section class="kpis">
    <div class="kpi"><div class="ico">♧</div><div><strong id="kpiActive">—</strong><span>Oportunidades ativas</span></div></div>
    <div class="kpi"><div class="ico">$</div><div><strong id="kpiPotential">—</strong><span>Receita potencial</span></div></div>
    <div class="kpi"><div class="ico">▤</div><div><strong id="kpiProposals">—</strong><span>Propostas enviadas</span></div></div>
    <div class="kpi"><div class="ico">🤝</div><div><strong id="kpiContracts">—</strong><span>Contratos</span></div></div>
  </section>
  <section class="filters">
    <input id="filterClient" placeholder="Buscar cliente">
    <select id="filterStage"><option value="">Todas as etapas</option><option>lead</option><option>dados</option><option>analise</option><option>proposta</option><option>aceite</option><option>contrato</option></select>
    <select id="filterOwner"><option value="">Todos os responsáveis</option></select>
    <select id="filterSegment"><option value="">Todos os segmentos</option></select>
  </section>
  <div id="loading" class="loading">Carregando oportunidades…</div>
  <div id="error" class="error hidden"></div>
  <div class="board-wrap"><section id="board" class="board hidden"></section></div>
  <div class="footer">✦ &nbsp; PROCESSOS HOJE. LIBERDADE SEMPRE. &nbsp; · &nbsp; FÊNIX BPO</div>
</main>
</div>
<script>
const STAGES=[
  {id:'lead',label:'1. LEAD',color:'#bfc4cb'},
  {id:'dados',label:'2. DADOS RECEBIDOS',color:'#4b8dff'},
  {id:'analise',label:'3. ANÁLISE CFO',color:'#e3ad3f'},
  {id:'proposta',label:'4. PROPOSTA ENVIADA',color:'#f08a63'},
  {id:'aceite',label:'5. ACEITE',color:'#51d996'},
  {id:'contrato',label:'6. CONTRATO',color:'#58c6e6'}
];
let all=[];
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function monthly(i){const t=i?.proposal?.commercial_terms||{};return Number(t.monthly_fee||t.mensalidade||t.valor_mensal||t.monthly||0)}
function stage(i){const s=String(i.status||'').toLowerCase();if(s==='encerrado')return null;if(['contrato_autorizado','contrato_gerado','assinado','implantacao'].includes(s))return'contrato';if(['proposta_aceita_aguardando_cfo','aceita','aceite'].includes(s))return'aceite';if(['proposta_publicada','publicada','enviada_cliente','proposta_enviada'].includes(s))return'proposta';if(['proposta_aprovada_cfo','aprovada_cfo','em_analise_cfo','rascunho_cfo'].includes(s))return'analise';if(['recebido','dados_recebidos','novo'].includes(s))return'dados';return'lead'}
function clientName(i){return i.client?.nome_fantasia||i.client?.razao_social||i.raw_payload?.razao_social||'Cliente sem nome'}
function owner(i){return i.raw_payload?._pipeline?.owner||i.raw_payload?.responsavel_interno||'FÊNIX'}
function segment(i){return i.ramo||i.raw_payload?.ramo||'Sem segmento'}
function stamp(i){const d=new Date(i.updated_at||i.created_at||Date.now());return d.toLocaleDateString('pt-BR')}
function render(){
  const q=(document.getElementById('filterClient').value||document.getElementById('globalSearch').value||'').trim().toLowerCase();
  const fs=document.getElementById('filterStage').value,fo=document.getElementById('filterOwner').value,fg=document.getElementById('filterSegment').value;
  const filtered=all.filter(i=>{const st=stage(i);if(!st)return false;const hay=[clientName(i),i.client?.cnpj,owner(i),segment(i)].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!fs||st===fs)&&(!fo||owner(i)===fo)&&(!fg||segment(i)===fg)});
  const board=document.getElementById('board');board.innerHTML='';
  STAGES.forEach(s=>{const items=filtered.filter(i=>stage(i)===s.id);const total=items.reduce((a,i)=>a+monthly(i),0);const col=document.createElement('article');col.className='col';col.style.setProperty('--stage',s.color);col.innerHTML=`<header class="col-head"><div class="col-head-top"><span>${s.label}</span><b class="col-count">${items.length}</b></div><div class="col-total">${money(total)}</div></header><div class="cards">${items.length?'':`<div class="empty">Nenhum cliente nesta etapa.</div>`}</div>`;const cards=col.querySelector('.cards');items.forEach(i=>{const d=document.createElement('div');d.className='deal';d.innerHTML=`<h3>${esc(clientName(i))}</h3><div class="cnpj">CNPJ ${esc(i.client?.cnpj||'—')}</div><span class="tag">${esc(segment(i))}</span>${monthly(i)?`<div class="money">${money(monthly(i))}/mês</div>`:''}<div class="deal-meta"><span>${esc(owner(i))}</span><span>${stamp(i)}</span></div>`;d.onclick=()=>location.href=`/painel/analise/?id=${encodeURIComponent(i.id)}`;cards.appendChild(d)});board.appendChild(col)});
  updateKpis();
}
function updateKpis(){const active=all.filter(i=>stage(i));const potential=active.reduce((a,i)=>a+monthly(i),0);const proposals=active.filter(i=>['proposta','aceite','contrato'].includes(stage(i))).length;const contracts=active.filter(i=>stage(i)==='contrato').length;document.getElementById('kpiActive').textContent=active.length;document.getElementById('kpiPotential').textContent=money(potential);document.getElementById('kpiProposals').textContent=proposals;document.getElementById('kpiContracts').textContent=contracts}
function populateFilters(){const owners=[...new Set(all.map(owner).filter(Boolean))].sort(),segments=[...new Set(all.map(segment).filter(Boolean))].sort();const o=document.getElementById('filterOwner'),s=document.getElementById('filterSegment');owners.forEach(v=>o.insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`));segments.forEach(v=>s.insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`))}
async function load(){try{const r=await fetch('/api/internal-intakes',{credentials:'same-origin'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`Erro ${r.status}`);all=Array.isArray(j.items)?j.items:[];populateFilters();document.getElementById('loading').classList.add('hidden');document.getElementById('board').classList.remove('hidden');render()}catch(e){document.getElementById('loading').classList.add('hidden');const box=document.getElementById('error');box.textContent='Não foi possível carregar o pipeline: '+e.message;box.classList.remove('hidden')}}
['filterClient','globalSearch'].forEach(id=>document.getElementById(id).addEventListener('input',render));['filterStage','filterOwner','filterSegment'].forEach(id=>document.getElementById(id).addEventListener('change',render));load();
</script>
</body>
</html>
