<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FÊNIX BPO — Levantamento de Dados</title><style>html,body{margin:0;background:#050505;color:#f5f1e8;font-family:Arial,Helvetica,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#f1c04d;font-weight:800}</style></head>
<body><div class="loading">Carregando formulário FÊNIX...</div><script>
fetch('/dados-v3/').then(r=>r.text()).then(html=>{
  html=html.replace('.hero{padding:30px 32px;margin-bottom:18px}.brand{font-size:clamp(30px,4vw,48px);line-height:1;font-weight:950;letter-spacing:.08em;color:var(--gold2);text-transform:uppercase}', '.hero{padding:30px 32px;margin-bottom:18px}.brand{display:flex;align-items:center;min-height:70px}.brand-logo{display:block;width:min(360px,70vw);height:auto;max-height:92px;object-fit:contain;object-position:left center}');
  html=html.replace('@media(max-width:800px){.grid3,.grid2,.ops,.scope{grid-template-columns:1fr}.wrap{padding:14px 10px 40px}.hero,.card{padding:20px 16px}.brand{font-size:28px}}', '@media(max-width:800px){.grid3,.grid2,.ops,.scope{grid-template-columns:1fr}.wrap{padding:14px 10px 40px}.hero,.card{padding:20px 16px}.brand-logo{width:min(300px,78vw);max-height:78px}}');
  html=html.replace('<section class="hero"><div class="brand">FÊNIX INTELLIGENT BPO</div><h1>Levantamento de dados</h1>', '<section class="hero"><div class="brand"><img class="brand-logo" src="/assets/fenix-logo-header-crop.webp" alt="FÊNIX Intelligent BPO"></div><h1>Levantamento de dados</h1>');
  document.open();document.write(html);document.close();
}).catch(()=>{document.querySelector('.loading').textContent='Não foi possível carregar o formulário agora.'});
</script></body></html>
