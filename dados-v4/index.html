<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FÊNIX BPO — Levantamento de Dados</title><style>html,body{margin:0;background:#050505;color:#f5f1e8;font-family:Arial,Helvetica,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#f1c04d;font-weight:800}</style></head>
<body><div class="loading">Carregando formulário FÊNIX...</div><script>
fetch('/dados-v3/').then(r=>r.text()).then(html=>{
  const extraCss=`
    html[data-intake-theme="light"]{--bg:#f4f1ea;--panel:#ffffff;--panel2:#faf8f3;--ink:#101326;--muted:#6d665c;--line:#dfd5c3;--gold:#c58b18;--gold2:#a86f08;--field:#ffffff;--fieldline:#d9cfbd;--shadow:0 12px 32px rgba(39,30,18,.08)}
    html[data-intake-theme="light"] body{background:radial-gradient(circle at 80% 8%,rgba(217,154,29,.10),transparent 28%),var(--bg);color:var(--ink)}
    html[data-intake-theme="light"] .hero{background:linear-gradient(135deg,#fff,#f7f2e8)!important}
    html[data-intake-theme="light"] .hero h1{color:#101326!important}
    html[data-intake-theme="light"] .hero p{color:#5f5a52!important}
    .hero{position:relative!important;text-align:center!important;padding:34px 34px 30px!important}
    .brand{display:flex!important;align-items:center!important;justify-content:center!important;min-height:112px!important;margin:0 auto 12px!important}
    .brand-logo{display:block!important;width:min(620px,78vw)!important;height:auto!important;max-height:150px!important;object-fit:contain!important;object-position:center!important}
    .hero h1{font-size:clamp(22px,2.4vw,30px)!important;line-height:1.15!important;letter-spacing:.09em!important;margin:8px 0 10px!important;text-align:center!important;color:#fff!important}
    .hero p{max-width:840px!important;margin:0 auto!important;text-align:center!important;font-size:17px!important}
    .theme-toggle{position:absolute;right:22px;top:22px;z-index:4;border:1px solid rgba(241,192,77,.48);background:#080808;color:#f5d36b;border-radius:999px;padding:10px 15px;font-size:14px;font-weight:900;cursor:pointer}
    html[data-intake-theme="light"] .theme-toggle{background:#fff;color:#8a5b05;border-color:#c99a32}
    @media(max-width:800px){.hero{padding:24px 16px 22px!important}.brand{min-height:88px!important;padding-top:34px}.brand-logo{width:min(460px,88vw)!important;max-height:112px!important}.hero h1{font-size:22px!important}.hero p{font-size:16px!important}.theme-toggle{right:14px;top:14px;padding:8px 11px;font-size:13px}}
  `;
  html=html.replace('</style>',extraCss+'</style>');
  html=html.replace('<section class="hero"><div class="brand">FÊNIX INTELLIGENT BPO</div><h1>Levantamento de dados</h1>', '<section class="hero"><button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema">☀ Claro</button><div class="brand"><img class="brand-logo" src="https://drive.google.com/thumbnail?id=13tZmkBjfMthdrdqEhwD2Efw8x_4UmHvh&sz=w1200" onerror="this.onerror=null;this.src=\'/assets/fenix-logo-transparent.webp\'" alt="FÊNIX Intelligent BPO"></div><h1>Levantamento de dados</h1>');
  const themeScript=`<script>(function(){const root=document.documentElement,btn=document.getElementById('themeToggle');const saved=localStorage.getItem('fenix-intake-theme')||'dark';function set(t){root.setAttribute('data-intake-theme',t);if(btn)btn.textContent=t==='dark'?'☀ Claro':'☾ Escuro';localStorage.setItem('fenix-intake-theme',t)}set(saved);if(btn)btn.addEventListener('click',()=>set(root.getAttribute('data-intake-theme')==='dark'?'light':'dark'));})();<\/script>`;
  html=html.replace('</body>',themeScript+'</body>');
  document.open();document.write(html);document.close();
}).catch(()=>{document.querySelector('.loading').textContent='Não foi possível carregar o formulário agora.'});
</script></body></html>
