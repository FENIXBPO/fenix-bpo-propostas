<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FÊNIX BPO — Levantamento de Dados</title><style>html,body{margin:0;background:#050505;color:#f5f1e8;font-family:Arial,Helvetica,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#f1c04d;font-weight:800}</style></head>
<body><div class="loading">Carregando formulário FÊNIX...</div><script>
fetch('/dados-v3/').then(r=>r.text()).then(html=>{
  html=html.replace('.hero{padding:30px 32px;margin-bottom:18px}.brand{font-size:clamp(30px,4vw,48px);line-height:1;font-weight:950;letter-spacing:.08em;color:var(--gold2);text-transform:uppercase}', '.hero{padding:34px 34px;margin-bottom:18px}.brand{display:flex;align-items:center;min-height:96px;margin-bottom:8px}.brand-logo{display:block;width:min(470px,82vw);height:auto;max-height:118px;object-fit:contain;object-position:left center}.hero h1{font-size:clamp(28px,3.5vw,42px)!important;margin-top:10px!important}');
  html=html.replace('@media(max-width:800px){.grid3,.grid2,.ops,.scope{grid-template-columns:1fr}.wrap{padding:14px 10px 40px}.hero,.card{padding:20px 16px}.brand{font-size:28px}}', '@media(max-width:800px){.grid3,.grid2,.ops,.scope{grid-template-columns:1fr}.wrap{padding:14px 10px 40px}.hero,.card{padding:20px 16px}.brand{min-height:76px}.brand-logo{width:min(360px,88vw);max-height:92px}.hero h1{font-size:28px!important}}');
  html=html.replace('<section class="hero"><div class="brand">FÊNIX INTELLIGENT BPO</div><h1>Levantamento de dados</h1>', '<section class="hero"><div class="brand"><img class="brand-logo" src="https://drive.google.com/thumbnail?id=13tZmkBjfMthdrdqEhwD2Efw8x_4UmHvh&sz=w1000" onerror="this.onerror=null;this.src=\'/assets/fenix-logo-transparent.webp\'" alt="FÊNIX Intelligent BPO"></div><h1>Levantamento de dados</h1>');
  document.open();document.write(html);document.close();
}).catch(()=>{document.querySelector('.loading').textContent='Não foi possível carregar o formulário agora.'});
</script></body></html>
