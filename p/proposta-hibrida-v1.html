<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>FÊNIX — Proposta Comercial</title>
<link rel="stylesheet" href="/assets/proposta-hibrida-master-v1.css" />
<script defer src="/assets/proposta-hibrida-master-v1.js"></script>
</head>
<body>
<main id="deck" class="deck" aria-label="Proposta Comercial FÊNIX">
  <section class="slide" data-page="1"><img src="/assets/master-hibrido-v1/page-1.webp" alt="" />
    <div id="p1Client" class="ov p1-client"></div>
    <div id="p1FooterClient" class="ov footer-client"></div><div id="p1FooterSegment" class="ov footer-segment"></div><div id="p1FooterDate" class="ov footer-date"></div>
  </section>
  <section class="slide" data-page="2"><img src="/assets/master-hibrido-v1/page-2.webp" alt="" />
    <div id="scenario" class="ov p2-scenario"></div><div id="challenges" class="ov p2-challenges"></div><div id="objective" class="ov p2-objective"></div>
    <div id="qtdCnpjs" class="ov p2-cnpjs"></div><div id="qtdBancos" class="ov p2-banks"></div><div id="volumePrevisto" class="ov p2-volume"></div>
    <div id="p2FooterClient" class="ov footer-client"></div><div id="p2FooterSegment" class="ov footer-segment"></div><div id="p2FooterDate" class="ov footer-date"></div>
  </section>
  <section class="slide" data-page="3"><div class="sprite-page sprite-3" aria-hidden="true"></div>
    <div id="operationalScope" class="ov scope-list scope-op"></div><div id="managerialScope" class="ov scope-list scope-mgr"></div>
    <div id="p3FooterClient" class="ov footer-client"></div><div id="p3FooterSegment" class="ov footer-segment"></div><div id="p3FooterDate" class="ov footer-date"></div>
  </section>
  <section class="slide" data-page="4"><div class="sprite-page sprite-4" aria-hidden="true"></div>
    <div id="operatingRules" class="ov p4-rules"></div>
    <div id="p4FooterClient" class="ov footer-client"></div><div id="p4FooterSegment" class="ov footer-segment"></div><div id="p4FooterDate" class="ov footer-date"></div>
  </section>
  <section class="slide" data-page="5"><div class="sprite-page sprite-5" aria-hidden="true"></div>
    <div id="softwareName" class="ov p5-software"></div>
    <div id="p5FooterClient" class="ov footer-client"></div><div id="p5FooterSegment" class="ov footer-segment"></div><div id="p5FooterDate" class="ov footer-date"></div>
  </section>
  <section class="slide" data-page="6"><div class="sprite-page sprite-6" aria-hidden="true"></div>
    <div id="implementationTime" class="ov p6-time"></div><div id="implementationDependencies" class="ov p6-deps"></div>
    <div id="p6FooterClient" class="ov footer-client"></div><div id="p6FooterSegment" class="ov footer-segment"></div><div id="p6FooterDate" class="ov footer-date"></div>
  </section>
  <section class="slide" data-page="7"><div class="sprite-page sprite-7" aria-hidden="true"></div>
    <div id="fenixMonthly" class="ov p7-fenix"></div><div id="softwareValue" class="ov p7-software"></div><div id="implementationValue" class="ov p7-impl"></div><div id="totalMonthly" class="ov p7-total"></div>
    <div id="softwareMask" class="software-mask" hidden></div><div id="commercialConditions" class="ov p7-conditions"></div>
    <div id="p7FooterClient" class="ov footer-client"></div><div id="p7FooterSegment" class="ov footer-segment"></div><div id="p7FooterDate" class="ov footer-date"></div>
  </section>
  <section class="slide" data-page="8"><div class="sprite-page sprite-8" aria-hidden="true"></div>
    <a id="acceptLink" class="accept-hotspot" aria-label="Aceitar proposta"></a><div id="acceptUrl" class="ov p8-url"></div>
    <div id="p8FooterClient" class="ov footer-client"></div><div id="p8FooterSegment" class="ov footer-segment"></div><div id="p8FooterDate" class="ov footer-date"></div>
  </section>
</main>
<div id="error" class="error" hidden></div>
</body>
</html>
