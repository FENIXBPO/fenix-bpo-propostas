<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FÊNIX — Capa Golden Reference v2</title>
<style>
:root{--gold:#d79a1c;--gold2:#f4ca61;--bg:#020910;--white:#f1eee8}
*{box-sizing:border-box}html,body{margin:0;background:#000;font-family:Inter,Arial,sans-serif}.stage{min-height:100vh;display:grid;place-items:center;padding:20px}.page{position:relative;width:min(100%,1600px);aspect-ratio:16/9;overflow:hidden;background:radial-gradient(circle at 8% 16%,rgba(19,42,56,.28),transparent 25%),radial-gradient(circle at 60% 40%,rgba(11,29,40,.15),transparent 34%),linear-gradient(116deg,#02070d 0%,#04101a 50%,#02080e 100%);color:var(--white);box-shadow:0 24px 80px rgba(0,0,0,.55)}
.page:before{content:"";position:absolute;inset:0;opacity:.18;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(255,255,255,.006) 0 1px,transparent 1px 4px);mix-blend-mode:screen;pointer-events:none}
.logo{position:absolute;left:5.2%;top:6.1%;width:42%;z-index:8;filter:drop-shadow(0 8px 18px rgba(0,0,0,.58))}.logo img{display:block;width:100%;height:auto}
.wing{position:absolute;right:-8.5%;top:0%;width:42%;height:84%;background:url('https://raw.githubusercontent.com/FENIXBPO/fenix-bpo-propostas/main/assets/fenix-symbol.png') no-repeat 74% 10%/138% auto;filter:grayscale(1) brightness(.30) contrast(1.18);opacity:.23;transform:rotate(2deg);z-index:1;-webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.28) 22%,#000 45%,#000 100%);mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.28) 22%,#000 45%,#000 100%)}
.diag{position:absolute;right:-4.5%;height:2px;z-index:5;transform-origin:right center;background:linear-gradient(90deg,rgba(93,56,3,0) 0%,#8c5607 19%,#d99418 39%,#ffe083 55%,#fff0ae 59%,#d58c16 77%,rgba(111,66,4,.12) 100%);box-shadow:0 0 2px rgba(255,239,185,.95),0 0 10px rgba(238,170,44,.48),0 0 24px rgba(187,113,8,.16)}
.diag.top{top:10.2%;width:39%;transform:rotate(44deg)}.diag.bottom{bottom:13.5%;width:36%;transform:rotate(-49deg)}
.diag:after{content:"";position:absolute;left:56%;top:-3px;width:8px;height:8px;border-radius:50%;background:#fff0b1;box-shadow:0 0 7px #ffe28b,0 0 19px rgba(238,168,38,.68),0 0 38px rgba(211,126,10,.30)}
.corner{position:absolute;right:-1%;bottom:-2%;width:22.6%;height:13.5%;clip-path:polygon(27% 0,100% 0,100% 100%,0 100%);background:radial-gradient(circle at 62% 20%,rgba(255,231,150,.17),transparent 17%),linear-gradient(145deg,#2e1d03 0%,#694405 35%,#a97113 67%,#815308 83%,#3d2704 100%);border-top:1px solid rgba(239,191,88,.78);box-shadow:inset 0 0 38px rgba(255,224,140,.08),0 0 18px rgba(180,112,10,.09);z-index:3}.corner:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(18deg,rgba(255,255,255,.028) 0 1px,transparent 1px 4px);opacity:.46}
.content{position:absolute;left:5.1%;top:35.8%;width:79%;z-index:6}.eyebrow{font-size:clamp(14px,1.18vw,20px);font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:#e9ad2d;margin-bottom:1.55%}.client{margin:0;max-width:100%;font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:clamp(62px,7.55vw,132px);font-weight:900;line-height:.84;letter-spacing:.003em;text-transform:uppercase;background:linear-gradient(180deg,#f7d56d 0%,#e0aa32 34%,#a76e14 68%,#e3ad36 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 11px rgba(119,71,4,.14)}
.rule{width:11%;height:3px;background:linear-gradient(90deg,#f0bd42,#875108);margin:2.15% 0 1.7%}.brandline{font-size:clamp(20px,2.15vw,38px);font-weight:700;letter-spacing:.09em;color:#f4f0e9}.brandline b{color:#d79a1c}.tagline{font-size:clamp(16px,1.42vw,25px);font-weight:300;margin:.8% 0 0;color:#ddd8d0}
.meta{position:absolute;left:5.05%;right:23%;bottom:8.4%;height:12.8%;border-top:1px solid rgba(190,124,16,.60);display:grid;grid-template-columns:1.28fr 1fr 1.16fr;z-index:6}.item{display:flex;align-items:center;gap:20px;padding:2.15% 3.7% 0 0;position:relative}.item+.item{padding-left:4.8%}.item+.item:before{content:"";position:absolute;left:0;top:24%;bottom:4%;width:1px;background:#bd7b10}.icon{width:58px;height:58px;border:2px solid #e0a528;border-radius:50%;display:grid;place-items:center;color:#e0a528;font-size:27px;flex:0 0 auto}.label{font-size:clamp(12px,1vw,17px);font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:#e0a528;margin-bottom:9px}.value{font-size:clamp(15px,1.35vw,24px);font-weight:300;color:#f1eee8;white-space:nowrap}
.bottomline{position:absolute;left:0;right:0;bottom:5.1%;height:1px;background:linear-gradient(90deg,transparent 0,#9b600a 5%,#d69a1b 70%,transparent 84%);z-index:6}.footer{position:absolute;left:5.05%;bottom:1.45%;display:flex;align-items:center;gap:26px;z-index:6;color:#d19a27}.footer img{width:130px;opacity:.9}.footer span{font-size:clamp(8px,.72vw,13px);letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}
@media(max-width:900px){.logo{width:47%;left:4%;top:4%}.content{top:31%;width:82%}.wing{right:-20%;width:55%;opacity:.16}.meta{right:4.8%;grid-template-columns:1fr 1fr 1fr}.item{gap:12px}.icon{width:44px;height:44px}.footer{display:none}.bottomline{bottom:2.6%}}
</style>
</head>
<body>
<div class="stage"><section class="page" aria-label="Capa de teste da proposta FÊNIX">
<div class="logo"><img src="https://raw.githubusercontent.com/FENIXBPO/fenix-bpo-propostas/main/assets/fenix-logo-transparent.webp" alt="FÊNIX Intelligent BPO"></div>
<div class="wing"></div><div class="diag top"></div><div class="diag bottom"></div><div class="corner"></div>
<div class="content"><div class="eyebrow">Proposta Comercial</div><h1 class="client" id="clientName">CONFIAR IMÓVEIS LTDA</h1><div class="rule"></div><div class="brandline">FÊNIX INTELLIGENT <b>BPO</b></div><p class="tagline">Organização financeira com inteligência operacional</p></div>
<div class="meta"><div class="item"><div class="icon">◎</div><div><div class="label">Cliente</div><div class="value">Confiar Imóveis Ltda</div></div></div><div class="item"><div class="icon">▥</div><div><div class="label">Segmento</div><div class="value">Imobiliário</div></div></div><div class="item"><div class="icon">▦</div><div><div class="label">Data</div><div class="value">27 de agosto de 2026</div></div></div></div>
<div class="bottomline"></div><div class="footer"><img src="https://raw.githubusercontent.com/FENIXBPO/fenix-bpo-propostas/main/assets/fenix-logo-header.webp" alt=""><span>Inteligência que transforma. Resultados que permanecem.</span></div>
</section></div>
<script>(function(){const el=document.getElementById('clientName');let s=parseFloat(getComputedStyle(el).fontSize),max=el.parentElement.clientWidth;while((el.scrollWidth>max||el.scrollHeight>el.clientHeight*2.05)&&s>52){s-=2;el.style.fontSize=s+'px'}})();</script>
</body></html>
