<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FÊNIX — Teste Capa Golden Reference</title>
<style>
:root{--gold:#d79a1c;--gold2:#f0c455;--bg:#020910;--white:#f1eee8}
*{box-sizing:border-box}html,body{margin:0;background:#000;font-family:Inter,Arial,sans-serif}.stage{min-height:100vh;display:grid;place-items:center;padding:24px}.page{position:relative;width:min(100%,1600px);aspect-ratio:16/9;overflow:hidden;background:
radial-gradient(circle at 8% 15%,rgba(16,37,51,.32),transparent 24%),
radial-gradient(circle at 65% 38%,rgba(10,28,39,.18),transparent 30%),
linear-gradient(116deg,#02070d 0%,#04101a 48%,#02080e 100%);color:var(--white);box-shadow:0 24px 80px rgba(0,0,0,.55)}
.page:before{content:"";position:absolute;inset:0;opacity:.22;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(255,255,255,.006) 0 1px,transparent 1px 4px);mix-blend-mode:screen;pointer-events:none}
.logo{position:absolute;left:4.2%;top:5.2%;width:31%;z-index:5;filter:drop-shadow(0 7px 16px rgba(0,0,0,.5))}.logo img{display:block;width:100%;height:auto}
.wing{position:absolute;right:-7%;top:1%;width:35%;height:78%;background:url('/assets/fenix-symbol.png') no-repeat 72% 20%/140% auto;filter:grayscale(1) brightness(.22) contrast(1.2);opacity:.22;transform:rotate(3deg);z-index:1;mask-image:linear-gradient(90deg,transparent 0%,#000 30%,#000 100%)}
.diag{position:absolute;right:-7%;height:2px;z-index:3;background:linear-gradient(90deg,transparent,#8d5707 18%,#f6ca5a 48%,#fff0ae 56%,#c98412 80%,transparent);box-shadow:0 0 6px rgba(255,224,142,.7),0 0 18px rgba(222,146,25,.25)}
.diag.top{top:16%;width:32%;transform:rotate(43deg)}.diag.bottom{bottom:18%;width:30%;transform:rotate(-45deg)}
.diag:after{content:"";position:absolute;left:58%;top:-3px;width:8px;height:8px;border-radius:50%;background:#ffe9a5;box-shadow:0 0 10px #ffd36a,0 0 24px rgba(231,155,28,.62)}
.corner{position:absolute;right:-1%;bottom:-2%;width:24%;height:15%;clip-path:polygon(24% 0,100% 0,100% 100%,0 100%);background:radial-gradient(circle at 60% 18%,rgba(255,227,136,.17),transparent 16%),linear-gradient(145deg,#3b2605,#875b0c 44%,#b17a19 69%,#6b4508 100%);border-top:1px solid rgba(239,191,88,.8);box-shadow:inset 0 0 30px rgba(255,231,155,.07),0 0 14px rgba(193,127,16,.12);z-index:2}.corner:after{content:"";position:absolute;inset:0;opacity:.4;background:repeating-linear-gradient(14deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px)}
.content{position:absolute;left:4.8%;top:35%;width:76%;z-index:4}.eyebrow{font-size:clamp(14px,1.1vw,19px);font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:#e7aa2c;margin-bottom:1.7%}.client{margin:0;max-width:100%;font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:clamp(58px,7.6vw,132px);font-weight:900;line-height:.84;letter-spacing:.005em;text-transform:uppercase;background:linear-gradient(180deg,#f6d46e 0%,#dea52d 34%,#9f6710 68%,#e0aa33 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 10px rgba(123,74,5,.15)}
.rule{width:12%;height:3px;background:linear-gradient(90deg,#f0bb3c,#8a5408);margin:2.2% 0 1.8%}.brandline{font-size:clamp(20px,2.2vw,39px);font-weight:700;letter-spacing:.09em;color:#f4f0e9}.brandline b{color:#d79a1c}.tagline{font-size:clamp(16px,1.45vw,26px);font-weight:300;margin:.9% 0 0;color:#ddd8d0}
.meta{position:absolute;left:4.8%;right:22%;bottom:8.4%;height:12.6%;border-top:1px solid rgba(190,124,16,.62);display:grid;grid-template-columns:1.2fr 1fr 1fr;z-index:4}.item{display:flex;align-items:center;gap:20px;padding:2.1% 3.7% 0 0;position:relative}.item+.item{padding-left:4.4%}.item+.item:before{content:"";position:absolute;left:0;top:25%;bottom:5%;width:1px;background:#bf7d12}.icon{width:58px;height:58px;border:2px solid #e0a528;border-radius:50%;display:grid;place-items:center;color:#e0a528;font-size:27px;flex:0 0 auto}.label{font-size:clamp(12px,1vw,17px);font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:#e0a528;margin-bottom:9px}.value{font-size:clamp(15px,1.35vw,24px);font-weight:300;color:#f1eee8;white-space:nowrap}
.bottomline{position:absolute;left:0;right:0;bottom:5.1%;height:1px;background:linear-gradient(90deg,transparent 0,#9c620b 5%,#d79a1c 69%,transparent 84%);z-index:4}
.footer{position:absolute;left:4.8%;bottom:1.6%;display:flex;align-items:center;gap:24px;z-index:4;color:#d19a27}.footer img{width:120px;opacity:.88}.footer span{font-size:clamp(8px,.74vw,13px);letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}
@media(max-width:900px){.content{top:31%;width:80%}.meta{right:4.8%;grid-template-columns:1fr 1fr 1fr}.item{gap:12px}.icon{width:44px;height:44px}.footer{display:none}.bottomline{bottom:2.6%}}
</style>
</head>
<body>
<div class="stage">
  <section class="page" aria-label="Capa de teste da proposta FÊNIX">
    <div class="logo"><img src="/assets/fenix-logo-transparent.webp" alt="FÊNIX Intelligent BPO"></div>
    <div class="wing"></div><div class="diag top"></div><div class="diag bottom"></div><div class="corner"></div>
    <div class="content">
      <div class="eyebrow">Proposta Comercial</div>
      <h1 class="client" id="clientName">CONFIAR IMÓVEIS LTDA</h1>
      <div class="rule"></div>
      <div class="brandline">FÊNIX INTELLIGENT <b>BPO</b></div>
      <p class="tagline">Organização financeira com inteligência operacional</p>
    </div>
    <div class="meta">
      <div class="item"><div class="icon">◎</div><div><div class="label">Cliente</div><div class="value">Confiar Imóveis Ltda</div></div></div>
      <div class="item"><div class="icon">▥</div><div><div class="label">Segmento</div><div class="value">Imobiliário</div></div></div>
      <div class="item"><div class="icon">▦</div><div><div class="label">Data</div><div class="value">27 de agosto de 2026</div></div></div>
    </div>
    <div class="bottomline"></div>
    <div class="footer"><img src="/assets/fenix-logo-header.webp" alt=""><span>Inteligência que transforma. Resultados que permanecem.</span></div>
  </section>
</div>
<script>
(function(){const el=document.getElementById('clientName');let s=parseFloat(getComputedStyle(el).fontSize);const max=el.parentElement.clientWidth;while((el.scrollWidth>max||el.scrollHeight>el.clientHeight*2.05)&&s>52){s-=2;el.style.fontSize=s+'px'}})();
</script>
</body>
</html>
