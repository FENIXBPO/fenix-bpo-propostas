<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrato FÊNIX BPO</title><style>body{margin:0;background:#f4f1e9;color:#1d1d1d;font-family:Arial,Helvetica,sans-serif}.top{position:sticky;top:0;background:#08111f;color:#fff;padding:14px 24px;display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:2px solid #c79a22}.brand{font-weight:800;letter-spacing:.08em}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #c79a22;background:#0d1830;color:#fff;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.btn.primary{background:#c79a22;color:#111}.btn:disabled{opacity:.55;cursor:not-allowed}.sheet{max-width:980px;margin:28px auto;background:#fff;padding:54px 64px;box-shadow:0 10px 40px rgba(0,0,0,.12)}h1{font-size:28px;text-align:center;margin:0 0 8px}h2{font-size:18px;margin-top:30px;border-bottom:1px solid #c79a22;padding-bottom:6px}h3{font-size:16px;margin-top:20px;color:#7b5b0a}p,li{font-size:14px;line-height:1.55}blockquote{background:#fff7df;border-left:4px solid #c79a22;margin:18px 0;padding:10px 14px;color:#665014}.warn,.ok{max-width:980px;margin:20px auto 0;padding:12px 16px;border-radius:8px}.warn{background:#fff3cd;border:1px solid #e0b64e}.ok{background:#e9f7ee;border:1px solid #78b48a}.error{max-width:980px;margin:40px auto;background:#ffe7e7;border:1px solid #d77;padding:16px;border-radius:8px}@media print{body{background:#fff}.top,.warn,.ok{display:none}.sheet{box-shadow:none;margin:0;max-width:none;padding:24mm 18mm}.sheet h2{break-after:avoid}.sheet p,.sheet li{orphans:3;widows:3}}@media(max-width:720px){.sheet{margin:0;padding:28px 20px}.top{position:static;align-items:flex-start;flex-direction:column}}</style></head><body><div class="top"><div class="brand">FÊNIX INTELLIGENT BPO · CONTRATO v22</div><div class="actions"><button id="generateBtn" class="btn primary" hidden>Confirmar geração</button><button class="btn" onclick="window.print()">Imprimir / Salvar PDF</button></div></div><div id="status"></div><main id="doc" class="sheet"><p>Carregando contrato...</p></main><script>(async()=>{const ref=new URLSearchParams(location.search).get('ref');const doc=document.getElementById('doc'),st=document.getElementById('status'),gen=document.getElementById('generateBtn');if(!ref){doc.innerHTML='<p>Contrato não informado.</p>';return}async function load(){const r=await fetch('/api/internal-contract-document?ref='+encodeURIComponent(ref),{credentials:'same-origin'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Falha ao preparar contrato.');doc.innerHTML=d.html;if(d.missing&&d.missing.length){st.className='warn';st.textContent='Contrato em prévia. Campos pendentes: '+d.missing.join(', ')+'. Complete esses dados antes da geração formal.';gen.hidden=true}else if(d.status==='gerado'){st.className='ok';st.textContent='Contrato gerado formalmente'+(d.generated_at?' em '+new Date(d.generated_at).toLocaleString('pt-BR'):'')+'. A impressão/PDF não altera mais o status.';gen.hidden=true}else{st.className='warn';st.textContent='Prévia pronta a partir da proposta aceita e autorizada pelo CFO. Revise e clique em “Confirmar geração” somente quando o documento estiver validado.';gen.hidden=!d.can_generate}return d}gen.addEventListener('click',async()=>{if(!confirm('Confirmar a geração formal deste contrato? Esta ação será registrada no histórico.'))return;gen.disabled=true;gen.textContent='Gerando...';try{const r=await fetch('/api/internal-contract-document',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({ref})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível confirmar a geração.');await load()}catch(e){st.className='warn';st.textContent=e.message;gen.disabled=false;gen.textContent='Confirmar geração'}});try{await load()}catch(e){doc.className='error';doc.textContent=e.message}})();</script></body></html>
